<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio | Diego Lujan Avila</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e9e9e9; 
    }
    .folder {
      position: relative;
      width: min(1180px, 100%);
    }
    .folder img {
      width: 100%;
      height: auto;
      display: block;
    }
    .papel {
      position: absolute;
      left: 34%;
      top: 19%;
      width: 21.5%;
      height: 58%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      font-family: Georgia, serif;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="folder">
    <img src="folder.png" alt="Un folder sosteniendo elementos visuales.">
    <div class="papel">
      <h1>Diego Lujan Avila</h1>
      <p>Portafolio</p>
    </div>
  </div>
</body>
</html>
