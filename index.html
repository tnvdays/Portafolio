<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portafolio | Diego Lujan Avila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Outfit:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --u: min(calc(100vw / 1155), calc(100vh / 657));
  }
  html, body { height: 100%; margin: 0; }
  body {
    position: relative;
    background: #e6e6e6;
    overflow: hidden;
    color: #1f1f1f;
  }

  .pieza { position: absolute; overflow: hidden; pointer-events: none; user-select: none; }
  .pieza img { position: absolute; max-width: none; display: block; }

  .lineas-tl { top: 0; left: 0; width: calc(var(--u) * 470); height: calc(var(--u) * 380); }
  .lineas-tl img { width: calc(var(--u) * 1692); left: calc(var(--u) * -285); top: calc(var(--u) * -233); }

  .lineas-br { bottom: 0; right: 0; width: calc(var(--u) * 450); height: calc(var(--u) * 380); }
  .lineas-br img { width: calc(var(--u) * 1692); left: calc(var(--u) * -995); top: calc(var(--u) * -510); }

  .puntos-tr { top: 0; right: 0; width: calc(var(--u) * 250); height: calc(var(--u) * 180); }
  .puntos-tr img { width: calc(var(--u) * 1040); left: calc(var(--u) * -851); top: calc(var(--u) * 64); }

  .puntos-bl { bottom: 0; left: 0; width: calc(var(--u) * 250); height: calc(var(--u) * 180); }
  .puntos-bl img { width: calc(var(--u) * 1040); left: calc(var(--u) * 54); top: calc(var(--u) * -413); }

  .colocadores {
    position: absolute;
    left: calc(50% - var(--u) * 91.5);
    top: calc(50% - var(--u) * 225);
    width: calc(var(--u) * 573);
    pointer-events: none;
    user-select: none;
  }

  .texto {
    position: absolute;
    margin: 0;
    line-height: 1;
    white-space: nowrap;
    transform: translateY(-50%);
  }
  .fino {
    font-family: "Outfit", system-ui, sans-serif;
    font-weight: 400;
  }

  .etiqueta {
    left: calc(50% - var(--u) * 4.5);
    top: calc(50% - var(--u) * 130);
    font-size: calc(var(--u) * 34);
  }

  h1.texto {
    left: 0;
    width: 100%;
    box-sizing: border-box;
    padding-left: calc(var(--u) * 18);
    text-align: center;
    top: calc(50% - var(--u) * 29);
    font-family: "Montserrat", system-ui, sans-serif;
    font-weight: 800;
    font-size: calc(var(--u) * 122);
    letter-spacing: -0.055em;
  }

  .descripcion {
    left: calc(50% - var(--u) * 483.5);
    top: calc(50% + var(--u) * 75);
    font-size: calc(var(--u) * 29);
  }

  .boton {
    position: absolute;
    left: calc(50% - var(--u) * 87.5);
    top: calc(50% + var(--u) * 168);
    width: calc(var(--u) * 195);
    transition: transform 0.15s ease;
  }
  .boton img { width: 100%; display: block; }
  .boton:hover { transform: translateY(-3px); }
  .boton:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div class="pieza lineas-tl"><img src="Linea.png" alt=""></div>
  <div class="pieza lineas-br"><img src="Linea.png" alt=""></div>
  <div class="pieza puntos-tr"><img src="Punto.png" alt=""></div>
  <div class="pieza puntos-bl"><img src="Punto.png" alt=""></div>

  <img class="colocadores" src="Colocadores.png" alt="">

  <p class="texto fino etiqueta">Portafolio técnico · 2026</p>
  <h1 class="texto">Diego Lujan Avila</h1>
  <p class="texto fino descripcion">Estudiante | Proyectos, aprendizaje e interés por la ingeniería.</p>

  <a class="boton" href="#proyectos"><img src="Explorar.png" alt="Explorar Proyectos"></a>
</body>
</html>
