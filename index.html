<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portafolio | Diego Lujan Avila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Outfit:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --u: min(calc(100vw / 1155), calc(100vh / 657));
  }
  html, body { height: 100%; margin: 0; }
  body {
    position: relative;
    background: #e6e6e6;
    overflow: hidden;
    color: #1f1f1f;
  }

  .pieza { position: absolute; overflow: hidden; pointer-events: none; user-select: none; }
  .pieza img { position: absolute; max-width: none; display: block; }

  .lineas-tl { top: 0; left: 0; width: calc(var(--u) * 470); height: calc(var(--u) * 380); }
  .lineas-tl img { width: calc(var(--u) * 1692); left: calc(var(--u) * -285); top: calc(var(--u) * -233); }

  .lineas-br { bottom: 0; right: 0; width: calc(var(--u) * 450); height: calc(var(--u) * 380); }
  .lineas-br img { width: calc(var(--u) * 1692); left: calc(var(--u) * -995); top: calc(var(--u) * -510); }

  .puntos-tr { top: 0; right: 0; width: calc(var(--u) * 250); height: calc(var(--u) * 180); }
  .puntos-tr img { width: calc(var(--u) * 1040); left: calc(var(--u) * -851); top: calc(var(--u) * 64); }

  .puntos-bl { bottom: 0; left: 0; width: calc(var(--u) * 250); height: calc(var(--u) * 180); }
  .puntos-bl img { width: calc(var(--u) * 1040); left: calc(var(--u) * 54); top: calc(var(--u) * -413); }

  .texto {
    position: absolute; left: 0; width: 100%;
    text-align: center; margin: 0;
    transform: translateY(-50%);
  }
  .sub {
    font-family: "Outfit", system-ui, sans-serif;
    font-weight: 400;
    font-size: calc(var(--u) * 33.5);
    line-height: 1;
  }
  .arriba { top: calc(50% - var(--u) * 181); }
  .abajo  { top: calc(50% + var(--u) * 97); }

  h1.texto {
    top: calc(50% - var(--u) * 28);
    font-family: "Montserrat", system-ui, sans-serif;
    font-weight: 800;
    font-size: calc(var(--u) * 122);
    letter-spacing: -0.055em;
    line-height: 1;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="pieza lineas-tl"><img src="Linea.png" alt=""></div>
  <div class="pieza lineas-br"><img src="Linea.png" alt=""></div>
  <div class="pieza puntos-tr"><img src="Punto.png" alt=""></div>
  <div class="pieza puntos-bl"><img src="Punto.png" alt=""></div>

  <p class="texto sub arriba">insertar texto</p>
  <h1 class="texto">Diego Lujan Avila</h1>
  <p class="texto sub abajo">insertar texto</p>
</body>
</html>
