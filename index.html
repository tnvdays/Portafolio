<title>Portafolio | Diego Lujan Avila</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9}
  body{display:grid;place-items:center}
  /* Escenario de 1150x647: todas las piezas se colocan en % para escalar juntas */

  .p{position:absolute;display:block;height:auto;user-select:none;pointer-events:none}
  .mul{mix-blend-mode:multiply} /* el blanco del video queda transparente sobre el papel */
</style>
</head>
<body>

</main>
</body>
</html>
